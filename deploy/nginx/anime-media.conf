# =====================================================================
# STARK ANIME - NGINX MEDIA GATEWAY CONFIGURATION
# Location: /etc/nginx/sites-available/anime-media.conf
# =====================================================================

server {
    listen 80;
    server_name media.stark-anime.com; # Replace with your VPS domain or IP

    # Force HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name media.stark-anime.com; # Replace with your VPS domain or IP

    # SSL Certificate Configuration (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/media.stark-anime.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/media.stark-anime.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Media Storage Root
    root /srv/anime-media;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS Headers for Web App & Telegram Mini App
    add_header Access-Control-Allow-Origin * always; # Restrict to https://your-app.vercel.app in production
    add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers "Range, Authorization, X-Playback-Token" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    # 1. HLS Master Playlists & Quality Variant Playlists (.m3u8)
    location ~* \.m3u8$ {
        types {
            application/vnd.apple.mpegurl m3u8;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # 2. HLS Video Segments (.ts)
    location ~* \.ts$ {
        types {
            video/mp2t ts;
        }
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # 3. Thumbnails & Posters
    location /thumbnails/ {
        alias /srv/anime-media/thumbnails/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 4. Subtitles (.vtt, .srt)
    location /subtitles/ {
        alias /srv/anime-media/subtitles/;
        types {
            text/vtt vtt;
            application/x-subrip srt;
        }
        add_header Content-Type "text/vtt; charset=utf-8";
        expires 7d;
        try_files $uri =404;
    }

    # 5. BLOCK DIRECT ACCESS TO ORIGINAL SOURCE VIDEOS & TEMP/FAILED DIRECTORIES
    location /originals/ {
        deny all;
        return 403;
    }

    location /temp/ {
        deny all;
        return 403;
    }

    location /failed/ {
        deny all;
        return 403;
    }

    # 6. Proxy /api/ to Local Media Gateway / Worker API
    location /api/ {
        proxy_pass http://127.0.0.1:3005/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Logging
    access_log /var/log/nginx/stark_media_access.log;
    error_log /var/log/nginx/stark_media_error.log;
}
